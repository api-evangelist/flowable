openapi: 3.2.0
info:
  description: Flowable Platform
  version: v1
  title: Flowable IDM REST Tenants API
  contact:
    name: Flowable
    url: http://www.flowable.com/
servers:
- url: http://localhost:8090/idm-api
- url: https://localhost:8090/idm-api
tags:
- name: Tenants
paths:
  /tenants:
    get:
      tags:
      - Tenants
      summary: Get a list of tenants
      description: ''
      operationId: getTenants
      responses:
        '200':
          description: Indicates the tenants are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponseTenantResponse'
      security:
      - basicAuth: []
components:
  schemas:
    TenantResponse:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          example: default
          description: The id of the tenant
      description: The response for a tenant
    DataResponseTenantResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TenantResponse'
        total:
          type: integer
          format: int64
        start:
          type: integer
          format: int32
        sort:
          type: string
        order:
          type: string
        size:
          type: integer
          format: int32
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

openapi: 3.2.0
info:
  description: '# flowable / flowəb(ə)l /


    - a compact and highly efficient workflow and Business Process Management (BPM) platform for developers, system admins and business users.'
  version: v1
  title: Flowable CMMN REST Plan Item Instance Variables API
  contact:
    name: Flowable
    url: http://www.flowable.org/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: /flowable-rest/cmmn-api
tags:
- name: Plan Item Instance Variables
paths:
  /cmmn-runtime/plan-item-instances/{planItemInstanceId}/variables/{variableName}/data:
    get:
      tags:
      - Plan Item Instance Variables
      summary: Get the binary data for a variable
      description: ''
      operationId: getPlanItemInstanceVariableData
      parameters:
      - name: planItemInstanceId
        in: path
        required: true
        schema:
          type: string
      - name: variableName
        in: path
        required: true
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Indicates the plan item instance was found and the requested variables are returned.
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
                  format: byte
        '404':
          description: Indicates the requested plan item was not found or the plan item does not have a variable with the given name (in the given scope). Status message provides additional information.
      security:
      - basicAuth: []
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

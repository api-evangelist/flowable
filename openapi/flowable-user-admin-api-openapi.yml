openapi: 3.2.0
info:
  description: Flowable Platform
  version: v1
  title: Flowable IDM REST User Admin API
  contact:
    name: Flowable
    url: http://www.flowable.com/
servers:
- url: http://localhost:8090/idm-api
- url: https://localhost:8090/idm-api
tags:
- name: User Admin
paths:
  /users/reindex:
    post:
      tags:
      - User Admin
      summary: Reindex users
      description: The user has to have admin rights.
      operationId: reindexUsers
      responses:
        '204':
          description: Indicates users have been reindex.
        '403':
          description: Indicates the user has no admin rights.
      security:
      - basicAuth: []
  /users/{userId}/reindex:
    post:
      tags:
      - User Admin
      summary: Reindex user
      description: The user has to have admin rights.
      operationId: reindexUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Indicates the user has been reindexed.
        '403':
          description: Indicates the user has no admin rights.
      security:
      - basicAuth: []
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

openapi: 3.2.0
info:
  description: Flowable Platform
  version: v1
  title: Flowable Form REST Form Instance Models API
  contact:
    name: Flowable
    url: http://www.flowable.com/
servers:
- url: http://localhost:8090/form-api
- url: https://localhost:8090/form-api
tags:
- name: Form Instance Models
paths:
  /form/form-instance-model:
    post:
      tags:
      - Form Instance Models
      summary: Get a form instance model
      description: ''
      operationId: getFormInstanceModel
      requestBody:
        $ref: '#/components/requestBodies/FormRequest'
      responses:
        '200':
          description: Indicates the form instance was found and the model is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormInstanceModelResponse'
        '404':
          description: Indicates the form instance was not found.
      security:
      - basicAuth: []
components:
  schemas:
    CustomValidationDefinition:
      type: object
      properties:
        expression:
          type: string
        errorMsg:
          type: string
        i18n:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
    FormInstanceModelResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        key:
          type: string
        version:
          type: integer
          format: int32
        formInstanceId:
          type: string
        submittedBy:
          type: string
        submittedDate:
          type: string
          format: date-time
        selectedOutcome:
          type: string
        taskId:
          type: string
        processInstanceId:
          type: string
        processDefinitionId:
          type: string
        tenantId:
          type: string
        url:
          type: string
        formKey:
          type: string
        dialogSize:
          type: string
        dialogTitle:
          type: string
        dialogDescription:
          type: string
        forceValidation:
          type: boolean
        defaultDateFormat:
          type: string
        defaultNumberFormat:
          type: string
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RowDefinition'
        metadata:
          $ref: '#/components/schemas/MetadataDefinition'
        section:
          $ref: '#/components/schemas/SectionDefinition'
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/OutcomeDefinition'
        customValidations:
          type: array
          items:
            $ref: '#/components/schemas/CustomValidationDefinition'
    OutcomeDefinition:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
        visible:
          type: string
        enabled:
          type: string
        primary:
          type: string
        ignorePayload:
          type: boolean
        ignoreValidation:
          type: boolean
        hideErrors:
          type: boolean
        styleClass:
          type: string
        navigationUrl:
          type: string
        outcomeFormKey:
          type: string
        i18n:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
    RowDefinition:
      type: object
      properties:
        cols:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
    MetadataDefinition:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        modelType:
          type: string
        flowableDesignVersion:
          type: integer
          format: int32
    FormRequest:
      type: object
      properties:
        formInstanceId:
          type: string
        formDefinitionId:
          type: string
        formDefinitionKey:
          type: string
        taskId:
          type: string
        processInstanceId:
          type: string
        processDefinitionId:
          type: string
        scopeId:
          type: string
        scopeType:
          type: string
        scopeDefinitionId:
          type: string
        outcome:
          type: string
        tenantId:
          type: string
        parentDeploymentId:
          type: string
        variables:
          type: object
          additionalProperties:
            type: object
    SectionDefinition:
      type: object
      properties:
        name:
          type: string
        visibility:
          type: string
  requestBodies:
    FormRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FormRequest'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

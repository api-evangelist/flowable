        required: false
        schema:
          type: boolean
      - name: sort
        in: query
        description: The field to sort by. Defaults to 'startTime'.
        required: false
        schema:
          type: string
          enum:
          - activityId
          - activityName
          - activityType
          - duration
          - endTime
          - executionId
          - activityInstanceId
          - processDefinitionId
          - processInstanceId
          - startTime
          - tenantId
      - name: order
        in: query
        description: The sort order, either 'asc' or 'desc'. Defaults to 'asc'.
        required: false
        schema:
          type: string
      - name: start
        in: query
        description: Index of the first row to fetch. Defaults to 0.
        required: false
        schema:
          type: integer
      - name: size
        in: query
        description: Number of rows to fetch, starting from start. Defaults to 10.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Indicates that activity instances could be queried.
          content:

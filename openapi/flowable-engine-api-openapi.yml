openapi: 3.2.0
info:
  title: Flowable Engine API
  version: v1
  description: 'Operations tagged Engine across 5 of this provider''s published API definitions: flowable-bpmn-openapi.yml, flowable-content-openapi.yml, flowable-dmn-openapi.yml, flowable-form-openapi.yml, flowable-idm-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /flowable-rest/service
- url: http://localhost:8090/content-api
- url: https://localhost:8090/content-api
- url: /flowable-rest/dmn-api
- url: http://localhost:8090/form-api
- url: https://localhost:8090/form-api
- url: http://localhost:8090/idm-api
- url: https://localhost:8090/idm-api
tags:
- name: Engine
paths:
  /management/engine:
    get:
      tags:
      - Engine
      summary: Get engine info
      description: ''
      operationId: getEngineInfo
      responses:
        '200':
          description: Indicates the engine info is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineInfoResponse'
      security:
      - basicAuth: []
    servers:
    - url: /flowable-rest/service
  /management/properties:
    get:
      tags:
      - Engine
      summary: List engine properties
      description: ''
      operationId: getProperties
      responses:
        '200':
          description: Indicates the properties are returned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
      security:
      - basicAuth: []
    servers:
    - url: /flowable-rest/service
  /content-management/engine:
    get:
      tags:
      - Engine
      summary: Get Content engine info
      description: ''
      operationId: getEngineInfo
      responses:
        '200':
          description: Indicates the engine info is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineInfoResponse'
      security:
      - basicAuth: []
    servers:
    - url: http://localhost:8090/content-api
    - url: https://localhost:8090/content-api
  /dmn-management/engine:
    get:
      tags:
      - Engine
      summary: Get DMN engine info
      description: Returns a read-only view of the DMN engine that is used in this REST-service.
      operationId: getEngineInfo
      responses:
        '200':
          description: Indicates the engine info is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineInfoResponse'
      security:
      - basicAuth: []
    servers:
    - url: /flowable-rest/dmn-api
  /form-management/engine:
    get:
      tags:
      - Engine
      summary: Get form engine info
      description: Returns a read-only view of the engine that is used in this REST-service.
      operationId: getEngineInfo
      responses:
        '200':
          description: Indicates the engine info is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineInfoResponse'
      security:
      - basicAuth: []
    servers:
    - url: http://localhost:8090/form-api
    - url: https://localhost:8090/form-api
  /idm-management/engine:
    get:
      tags:
      - Engine
      summary: Get IDM engine info
      description: Returns a read-only view of the engine that is used in this REST-service.
      operationId: getEngineInfo
      responses:
        '200':
          description: Indicates the engine info is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineInfoResponse'
      security:
      - basicAuth: []
    servers:
    - url: http://localhost:8090/idm-api
    - url: https://localhost:8090/idm-api
components:
  schemas:
    EngineInfoResponse:
      type: object
      properties:
        name:
          type: string
          example: default
        resourceUrl:
          type: string
          example: file://flowable/flowable.cfg.xml
        exception:
          type: string
          example: 'null'
        version:
          type: string
          example: 6.3.1
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
x-refined-from:
- flowable-bpmn-openapi.yml
- flowable-content-openapi.yml
- flowable-dmn-openapi.yml
- flowable-form-openapi.yml
- flowable-idm-openapi.yml

components:
  schemas:
    HistoricVariableInstanceResponse:
      type: object
      properties:
        id:
          type: string
          example: '14'
        processInstanceId:
          type: string
          example: '5'
        processInstanceUrl:
          type: string
          example: http://localhost:8182/history/historic-process-instances/5
        taskId:
          type: string
          example: '6'
        executionId:
          type: string
        variable:
          $ref: '#/components/schemas/RestVariable'
    UserBodyQueryRequest:
      type: object
      properties:
        start:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        sort:
          type: string
        order:
          type: string
        id:
          type: string
          description: Only return users with the given id
        ids:
          type: array
          description: Only return users that match the given ids
          items:
            type: string
        idsNotIn:
          type: array
          description: Only return users that do not match the given ids
          items:
            type: string
        firstName:
          type: string
          description: Only return users with the given first name
        firstNameLike:
          type: string
          description: Only return users with first name like the given value
        firstNameLikeIgnoreCase:
          type: string
          description: Only return users with first name like the given value ignoring case
        lastName:
          type: string
          description: Only return users with the given last name
        lastNameLike:
          type: string
          description: Only return users with last name like the given value
        lastNameLikeIgnoreCase:
          type: string
          description: Only return users with last name like the given value ignoring case
        displayName:
          type: string
          description: Only return users with the given display name
        displayNameLike:
          type: string
          description: Only return users with display name like the given value
        displayNameLikeIgnoreCase:
          type: string
          description: Only return users with display name like the given value ignoring case
        fullNameLike:
          type: string
          description: Only return users with full name like the given value
        fullNameLikeIgnoreCase:
          type: string
          description: Only return users with full name like the given value ignoring case
        email:
          type: string
          description: Only return users with the given email
        emailLike:
          type: string
          description: Only return users with email like the given value
        state:
          type: string
          description: Only return users with the given state
        subState:
          type: string
          description: Only return users with the given sub state
        memberOfGroup:
          type: string
          description: Only return users that are member of the given group
        memberOfGroups:
          type: array
          description: Only return users that are member of any of the given groups
          items:
            type: string
        memberOfGroupKey:
          type: string
          description: Only return users that are member of the group with the given key
        memberOfGroupKeys:
          type: array
          description: Only return users that are member of any of the groups with the given keys
          items:
            type: string
        includeIdentityInfo:
          type: boolean
          description: Include the extra identity info for the users.
        tenantId:
          type: string
          description: Only return users within the given tenant. Only super admin users can modify this parameter, otherwise this is the user doing the request.
        accessibleByUser:
          type: string
          description: Only return users accessible by the given user. Only admin users can modify this parameter, otherwise this is the user doing the request.

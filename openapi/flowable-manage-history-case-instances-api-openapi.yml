openapi: 3.2.0
info:
  description: '# flowable / flowəb(ə)l /


    - a compact and highly efficient workflow and Business Process Management (BPM) platform for developers, system admins and business users.'
  version: v1
  title: Flowable CMMN REST Manage History Case Instances API
  contact:
    name: Flowable
    url: http://www.flowable.org/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: /flowable-rest/cmmn-api
tags:
- name: Manage History Case Instances
paths:
  /cmmn-history/historic-case-instances/delete:
    post:
      tags:
      - Manage History Case Instances
      summary: Post action request to delete a bulk of historic case instances
      description: ''
      operationId: bulkDeleteHistoricCaseInstances
      requestBody:
        $ref: '#/components/requestBodies/BulkDeleteInstancesRestActionRequest'
      responses:
        '204':
          description: Indicates the bulk of historic case instances was found and deleted. Response body is left empty intentionally.
        '404':
          description: Indicates at least one requested case instance was not found.
      security:
      - basicAuth: []
components:
  requestBodies:
    BulkDeleteInstancesRestActionRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BulkDeleteInstancesRestActionRequest'
  schemas:
    BulkDeleteInstancesRestActionRequest:
      type: object
      properties:
        action:
          type: string
        instanceIds:
          type: array
          items:
            type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
